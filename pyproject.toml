[project]
name = "ai-engine"
version = "0.0.0"
description = "Moteur IA : agent sur historique de séances et RAG sur appels d'offres publics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "ruff==0.17.5",
    "pytest==9.2.0",
    "pre-commit==4.7.0",
    "detect-secrets==1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["context"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographie française (×, ’, « »)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
